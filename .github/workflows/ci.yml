name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# CI is offline by design. Tests use in-memory SQLite, which selects all-fixture
# provider modes, so no job here reaches a live provider or spends anything.
env:
  GAIA_RUNTIME_MODE: test

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The command surface regressed to Windows-only once; the matrix keeps
        # it honest on every platform the project claims to support.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify SQLite has FTS5
        shell: bash
        run: python -c "import sqlite3; sqlite3.connect(':memory:').execute('CREATE VIRTUAL TABLE t USING fts5(body)'); print('FTS5 available')"

      - name: Constitution check
        shell: bash
        run: python scripts/bootstrap/validate_constitution.py

      - name: Run test suite
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" -v

  guardrails:
    name: Financial and provider guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Assert automatic paid usage stays disabled
        run: |
          python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              config = tomllib.load(handle)

          constitution = config["tool"]["gaia"]["financial_constitution"]
          violations = [key for key, value in constitution.items() if key.startswith("allow_") and value is not False]
          if violations:
              raise SystemExit(f"financial constitution violated: {violations} must be false")
          if constitution["total_initial_cash_budget_usd"] > 20.0:
              raise SystemExit("cash reserve raised above the documented $20 ceiling")
          print("financial constitution intact")
          PY

      - name: Assert no live smoke is required by default
        run: |
          python - <<'PY'
          import pathlib
          import re

          # Live smokes must stay opt-in: each one has to be guarded by a
          # GAIA_RUN_*_SMOKE env check so CI never depends on a live provider.
          offenders = []
          for path in pathlib.Path("tests").rglob("*smoke*.py"):
              text = path.read_text(encoding="utf-8")
              if not re.search(r"GAIA_RUN_[A-Z_]*SMOKE", text):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit(f"smoke tests missing opt-in guard: {offenders}")
          print("all smoke tests are opt-in")
          PY
