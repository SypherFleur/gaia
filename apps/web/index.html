<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAIA Workbench</title>
  <link rel="icon" href="/assets/gaia-mark.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">

    <header class="topbar">
      <div class="brand">
        <img src="/assets/gaia-mark.png" alt="" />
        <span>GAIA Workbench</span>
      </div>
      <div class="stat"><span>Location</span><b id="stat-location">none</b></div>
      <div class="stat"><span>Providers</span><b id="stat-providers">—</b></div>
      <div class="stat"><span>Model runs</span><b id="stat-modelruns">0</b></div>
      <div class="topbar-spacer"></div>
      <div class="stat"><span>Spend</span><b id="stat-spend">$0.00</b></div>
      <div class="stat"><span id="stat-mode" class="badge muted">local</span></div>
      <button class="btn small" id="btn-seed" title="Seed the demo workspace">Seed demo</button>
    </header>

    <!-- Ontology explorer. Objects first: the ontology is the navigation. -->
    <nav class="rail" aria-label="Ontology">
      <div class="rail-section">Ontology</div>
      <div id="object-types"></div>

      <div class="rail-section">Active location</div>
      <div style="padding: 0 12px 10px;">
        <select id="location-select" class="field" style="width: 100%; padding: 5px 7px; background: var(--bg-0); border: 1px solid var(--line-strong); border-radius: 3px;"></select>
        <div class="row" style="margin-top: 6px;">
          <button class="btn small" id="btn-geolocate" style="flex:1">Use device</button>
          <button class="btn small" id="btn-manual-location" style="flex:1">Enter</button>
        </div>
      </div>

      <div class="rail-section">Diagnostics</div>
      <div style="padding: 0 12px;">
        <button class="btn small" id="btn-system" style="width:100%">System &amp; providers</button>
      </div>
    </nav>

    <main class="main">
      <!-- Three pillars: how the work is actually organized. -->
      <div class="pillars" role="tablist">
        <button class="pillar active" data-pillar="planning" role="tab">
          <span class="pillar-name">Planning</span>
          <span class="pillar-sub">Seasons, actions, guidance</span>
        </button>
        <button class="pillar" data-pillar="evidence" role="tab">
          <span class="pillar-name">Evidence</span>
          <span class="pillar-sub">Sources, credibility, provenance</span>
        </button>
        <button class="pillar" data-pillar="identify" role="tab">
          <span class="pillar-name">Identify &amp; Forecast</span>
          <span class="pillar-sub">Taxonomy, vision, conditions, regulation</span>
        </button>
      </div>

      <div class="canvas" id="canvas"></div>

      <!-- Agent console: operates on the ontology, shows its route and sources. -->
      <section class="agent">
        <div class="agent-head">
          <span>Agent</span>
          <span class="badge muted" id="agent-route">idle</span>
          <span class="topbar-spacer"></span>
          <span class="muted" id="agent-hint">Deterministic routes answer without a model run</span>
        </div>
        <div class="agent-log" id="agent-log"></div>
        <form class="agent-form" id="agent-form">
          <input id="agent-input" placeholder="Ask GAIA — e.g. plan my fall garden, what county am I in, is it safe to move citrus to Florida" autocomplete="off" />
          <button class="btn primary" type="submit">Send</button>
        </form>
      </section>
    </main>

    <aside class="inspector" id="inspector">
      <div class="inspector-head">
        <div class="type" id="insp-type">Inspector</div>
        <div class="title" id="insp-title">Nothing selected</div>
        <div class="id" id="insp-id"></div>
      </div>
      <div id="insp-body">
        <div class="empty-state">
          Select an object to inspect it.
          <div class="hint">Every property shows its source and evidence grade.</div>
        </div>
      </div>
    </aside>

  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
